
name: Monitor USD BRL OTC

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: monitor-usdbrl-otc
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar monitor
        env:
          OTCHARTS_API_KEY: ${{ secrets.OTCHARTS_API_KEY }}
          OTCHARTS_SYMBOL: BRLUSD_otc
        run: python monitor.py

      - name: Salvar resultados
        run: |
          if [ -f data/monitor_usdbrl_otc.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/monitor_usdbrl_otc.csv
            if ! git diff --cached --quiet; then
              git commit -m "Atualizar resultados USD BRL OTC"
              git pull --rebase
              git push
            fi
          fi
