name: Monitor USD BRL OTC

"on":
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: monitor-usdbrl-otc
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar monitor
        env:
          OTCHARTS_API_KEY: ${{ secrets.OTCHARTS_API_KEY }}
          OTCHARTS_SYMBOL: BRLUSD_otc
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Testar notificacao Telegram
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              raise RuntimeError(
                  "Credenciais do Telegram nao configuradas."
              )

          mensagem = (
              "NEXUS OTC ANALYZER\n\n"
              "Teste de conexao realizado!\n\n"
              "GitHub Actions conectado ao Telegram.\n"
              "Monitor: USD/BRL OTC\n"
              "Status: notificacoes em configuracao.\n\n"
              "Esta mensagem e apenas um teste."
          )

          url = (
              f"https://api.telegram.org/bot{token}/sendMessage"
          )

          dados = json.dumps({
              "chat_id": chat_id,
              "text": mensagem
          }).encode("utf-8")

          requisicao = urllib.request.Request(
              url,
              data=dados,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(
              requisicao,
              timeout=20
          ) as resposta:
              resultado = json.load(resposta)

          if not resultado.get("ok"):
              raise RuntimeError(
                  "Telegram nao confirmou o envio."
              )

          print("Mensagem de teste enviada com sucesso.")
          PY

      - name: Salvar resultados
        run: |
          if [ -f data/monitor_usdbrl_otc.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/monitor_usdbrl_otc.csv
            if ! git diff --cached --quiet; then
              git commit -m "Atualizar resultados USD BRL OTC"
              git pull --rebase
              git push
            fi
          fi
