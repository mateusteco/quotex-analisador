name: Teste integrado streaming M1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Receber ticks e fechar candle M1
        env:
          OTCHARTS_API_KEY: ${{ secrets.OTCHARTS_API_KEY }}
        run: python teste_integrado_m1.py
