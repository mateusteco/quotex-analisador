name: Validar BTC Futures
on:
  push:
    paths: ['futures_*.py', 'app.py', 'tests/**', '.github/workflows/futures-tests.yml']
  pull_request:
    paths: ['futures_*.py', 'app.py', 'tests/**', '.github/workflows/futures-tests.yml']
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q futures_engine.py futures_worker.py futures_app.py app.py deploy
