name: Teste OTCharts Streaming
on:
  workflow_dispatch:
    inputs:
      capturar:
        description: Gravar ticks em CSV para comparação com vídeo
        type: boolean
        default: false
      segundos:
        description: Duração da captura (10 a 600 segundos)
        type: string
        default: '120'

permissions:
  contents: read

jobs:
  testar-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar requests
        run: python -m pip install requests
      - name: Testar ticks sem negociar
        env:
          OTCHARTS_API_KEY: ${{ secrets.OTCHARTS_API_KEY }}
        run: python teste_stream.py
      - name: Capturar preços e horários sem operar
        if: inputs.capturar
        env:
          OTCHARTS_API_KEY: ${{ secrets.OTCHARTS_API_KEY }}
          CAPTURA_SEGUNDOS: ${{ inputs.segundos }}
        run: python -u capturar_ticks.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.capturar
        with:
          name: cotacoes-nzdcad-${{ github.run_id }}
          path: capturas/*.csv
          retention-days: 3
          if-no-files-found: warn
