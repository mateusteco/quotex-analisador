name: Validar apuração simulada M1
on:
  workflow_dispatch:
  push:
    branches: [desenvolvimento-streaming-m1]
    paths:
      - 'apuracao_simulada_m1.py'
      - 'fluxo_alertas_m1.py'
      - 'alertas_simulacao.py'
      - 'test_apuracao_simulada_m1.py'
      - 'test_telegram_resultado_m1.py'
      - '.github/workflows/validar-apuracao-m1.yml'
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m unittest -v test_apuracao_simulada_m1.py test_telegram_resultado_m1.py
