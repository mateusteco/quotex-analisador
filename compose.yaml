services:
  nexus:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file: .env
    volumes:
      - nexus-data:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
volumes:
  nexus-data:
